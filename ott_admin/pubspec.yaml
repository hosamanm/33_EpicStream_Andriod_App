name: ott_admin
description: Professional Admin Panel for managing the OTT Stream platform.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Firebase Ecosystem ---
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  cloud_functions: ^4.5.3
  firebase_analytics: ^10.7.4

  # --- Navigation & Routing ---
  go_router: ^12.1.3

  # --- State Management ---
  provider: ^6.1.1
  get_it: ^7.6.4

  # --- UI & UX (Web Optimized) ---
  google_fonts: ^6.1.0
  intl: ^0.20.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  responsive_framework: ^1.1.1
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  file_picker: ^6.1.1

  # --- Utilities ---
  dio: ^5.3.3
  logger: ^2.0.2
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true
